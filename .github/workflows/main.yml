name: SylvaSan CI

on: [push]

jobs:
  backend-tests:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libffi-dev pkg-config libxml2-dev libxslt1-dev libjpeg-dev \
            gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Create PostGIS template database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE template_postgis;" 2>/dev/null || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d template_postgis -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "UPDATE pg_database SET datistemplate = true WHERE datname = 'template_postgis';"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DEBUG: True
          SECRET: test
          ENVIRONMENT: ci
          FORCE_HTTPS: False
          SECURE: False
          ALLOWED_HOSTS: localhost
          HOSTNAME: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: postgres
          STATICFILES_STORAGE: django.contrib.staticfiles.storage.StaticFilesStorage
          DEFAULT_FILE_STORAGE: django.core.files.storage.FileSystemStorage
          DEFAULT_FROM_EMAIL: test@example.com
          CONTACT_EMAIL: test@example.com
          EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py test

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build
        run: npm run build

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build
        run: npm run build
